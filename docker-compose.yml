# Runs backend + frontend on one Docker network (alternative to the manual docker commands)
services:
  superkart-backend:
    build: ./backend_files
    container_name: superkart-backend
    ports:
      - "7860:7860"
  superkart-frontend:
    build: ./frontend_files
    container_name: superkart-frontend
    environment:
      - BACKEND_URL=http://superkart-backend:7860
    ports:
      - "8501:8501"
    depends_on:
      - superkart-backend
